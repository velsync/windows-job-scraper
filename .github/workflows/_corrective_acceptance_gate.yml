name: Final S2.4-S2.5 corrective acceptance

on:
  push:
    branches:
      - repair/s2.4-s2.5-correctives-20260909
    paths:
      - .github/workflows/_corrective_acceptance_gate.yml
      - scripts/_apply_full_suite_expectation_reconciliation.py

permissions:
  contents: write

jobs:
  acceptance:
    name: Exact corrective gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/s2.4-s2.5-correctives-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply stale-expectation reconciliation
        run: python scripts/_apply_full_suite_expectation_reconciliation.py
      - name: Validate patch shape
        run: git diff --check
      - name: Create venv (Ubuntu)
        if: runner.os != 'Windows'
        run: python -m venv .venv
      - name: Create venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m venv .venv
      - name: Install exact dev lock and package (Ubuntu)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/python -m pip install -r requirements/dev.lock.txt
          .venv/bin/python -m pip install --no-deps .
      - name: Install exact dev lock and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv/Scripts/python -m pip install -r requirements/dev.lock.txt
          .venv/Scripts/python -m pip install --no-deps .
      - name: Run exact corrective gate (Ubuntu)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python scripts/verify_slice0.py
          .venv/bin/python scripts/verify_slice1.py
          echo "[slice2-pre-s2.9-gate] verify_slice2.py: N/A — authoritative Slice 2 plan reserves it for S2.9; validating cumulative S2.0-S2.5 surface directly"
          .venv/bin/python -m pytest -q \
            tests/contract/test_slice2_contract.py \
            tests/integration/test_schema_slice2.py \
            tests/integration/test_schema_slice2_s24.py \
            tests/integration/test_acquisition_evidence.py \
            tests/integration/test_company_location_provenance.py \
            tests/integration/test_company_resolution.py \
            tests/integration/test_search_indexed_pipeline.py \
            tests/integration/test_greenhouse_e2e.py \
            tests/integration/test_s2_2_corrective.py \
            tests/integration/test_s2_2_platform_host_coverage.py \
            tests/integration/test_s2_5_runtime_correctives.py \
            tests/unit/test_origin_resolver.py \
            tests/unit/test_locations.py \
            tests/unit/test_provenance_classes.py \
            tests/unit/test_contentclean.py \
            tests/unit/test_search_index.py \
            tests/unit/test_fingerprint.py \
            tests/unit/test_router.py \
            tests/unit/test_provisioning.py \
            tests/unit/test_greenhouse_adapter.py \
            tests/unit/test_s2_3_corrective.py \
            tests/unit/test_s2_4_correctives.py \
            tests/unit/test_s2_4_evidence_boundary_correctives.py \
            tests/unit/test_s2_4_provisioning_correctives.py \
            tests/unit/test_s2_5_greenhouse_contract_correctives.py
      - name: Run exact corrective gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv/Scripts/python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python scripts/verify_slice0.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python scripts/verify_slice1.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "[slice2-pre-s2.9-gate] verify_slice2.py: N/A — authoritative Slice 2 plan reserves it for S2.9; validating cumulative S2.0-S2.5 surface directly"
          .venv/Scripts/python -m pytest -q tests/contract/test_slice2_contract.py tests/integration/test_schema_slice2.py tests/integration/test_schema_slice2_s24.py tests/integration/test_acquisition_evidence.py tests/integration/test_company_location_provenance.py tests/integration/test_company_resolution.py tests/integration/test_search_indexed_pipeline.py tests/integration/test_greenhouse_e2e.py tests/integration/test_s2_2_corrective.py tests/integration/test_s2_2_platform_host_coverage.py tests/integration/test_s2_5_runtime_correctives.py tests/unit/test_origin_resolver.py tests/unit/test_locations.py tests/unit/test_provenance_classes.py tests/unit/test_contentclean.py tests/unit/test_search_index.py tests/unit/test_fingerprint.py tests/unit/test_router.py tests/unit/test_provisioning.py tests/unit/test_greenhouse_adapter.py tests/unit/test_s2_3_corrective.py tests/unit/test_s2_4_correctives.py tests/unit/test_s2_4_evidence_boundary_correctives.py tests/unit/test_s2_4_provisioning_correctives.py tests/unit/test_s2_5_greenhouse_contract_correctives.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  materialize:
    name: Materialize clean accepted tree
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/s2.4-s2.5-correctives-20260909
          fetch-depth: 0
      - name: Apply accepted expectation reconciliation
        run: python scripts/_apply_full_suite_expectation_reconciliation.py
      - name: Remove temporary repair machinery
        run: rm .github/workflows/_corrective_acceptance_gate.yml scripts/_apply_full_suite_expectation_reconciliation.py
      - name: Validate final patch shape
        run: git diff --check
      - name: Create clean accepted commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          paths = [p for p in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines() if p]
          if not paths:
              raise SystemExit("no accepted changes to materialize")

          def post(endpoint, payload):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{endpoint}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          entries = []
          for path in paths:
              mode_line = subprocess.check_output(["git", "ls-files", "-s", "--", path], text=True).strip()
              mode = mode_line.split()[0] if mode_line else "100644"
              if not os.path.exists(path):
                  entries.append({"path": path, "mode": mode, "type": "blob", "sha": None})
                  continue
              raw = open(path, "rb").read()
              blob = post("git/blobs", {
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              })["sha"]
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob})

          tree = post("git/trees", {"base_tree": base_tree, "tree": entries})["sha"]
          commit = post("git/commits", {
              "message": "chore(repair): seal accepted S2.4-S2.5 corrective tree",
              "tree": tree,
              "parents": [parent],
          })["sha"]
          print(f"ACCEPTED_CLEAN_COMMIT_SHA={commit}")
          print("ACCEPTED_PATHS=" + ",".join(paths))
          PY
