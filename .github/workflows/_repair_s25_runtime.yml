name: Apply S2.5 runtime corrective
# Materialize the exact focused-green corrective as an orphan Git object.
# Branch movement is intentionally delegated to the authenticated GitHub connector.

on:
  push:
    branches:
      - repair/s2.4-s2.5-correctives-20260909
    paths:
      - scripts/_apply_s25_runtime_corrective.py
      - .github/workflows/_repair_s25_runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: repair/s2.4-s2.5-correctives-20260909
          fetch-depth: 0
      - name: Apply exact corrective replacements
        run: python scripts/_apply_s25_runtime_corrective.py
      - name: Validate patch shape
        run: |
          git diff --check
          git status --short
      - name: Run focused corrective tests
        run: |
          python -m venv .repair-venv
          .repair-venv/bin/python -m pip install -r requirements/dev.lock.txt
          .repair-venv/bin/python -m pip install --no-deps .
          .repair-venv/bin/python -m pytest tests/integration/test_s2_5_runtime_correctives.py tests/unit/test_s2_5_greenhouse_contract_correctives.py tests/unit/test_contentclean.py -q
      - name: Materialize tested tree as Git object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          paths = [p for p in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines() if p]
          if not paths:
              raise SystemExit("no corrective changes to materialize")

          def post(endpoint, payload):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{endpoint}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          entries = []
          for path in paths:
              raw = open(path, "rb").read()
              blob = post("git/blobs", {
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              })["sha"]
              mode_line = subprocess.check_output(["git", "ls-files", "-s", "--", path], text=True).strip()
              mode = mode_line.split()[0] if mode_line else "100644"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob})

          tree = post("git/trees", {"base_tree": base_tree, "tree": entries})["sha"]
          commit = post("git/commits", {
              "message": "fix(s2.5): separate listing coverage from detail completion",
              "tree": tree,
              "parents": [parent],
          })["sha"]
          print(f"CORRECTIVE_COMMIT_SHA={commit}")
          print("CORRECTIVE_PATHS=" + ",".join(paths))
          PY
