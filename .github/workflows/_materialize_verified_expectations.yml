name: Materialize verified S2.5 expectation reconciliation

on:
  push:
    branches:
      - repair/s2.4-s2.5-correctives-20260909
    paths:
      - .github/workflows/_materialize_verified_expectations.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/s2.4-s2.5-correctives-20260909
          fetch-depth: 0
      - name: Apply tree already verified on Ubuntu and Windows in run 34349431196
        run: python scripts/_apply_full_suite_expectation_reconciliation.py
      - name: Remove temporary corrective machinery
        run: |
          rm .github/workflows/_corrective_acceptance_gate.yml
          rm scripts/_apply_full_suite_expectation_reconciliation.py
          rm .github/workflows/_materialize_verified_expectations.yml
      - name: Validate final patch shape
        run: git diff --check
      - name: Create clean verified commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          paths = [p for p in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines() if p]
          if not paths:
              raise SystemExit("no verified changes to materialize")

          def post(endpoint, payload):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{endpoint}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          entries = []
          for path in paths:
              mode_line = subprocess.check_output(["git", "ls-files", "-s", "--", path], text=True).strip()
              mode = mode_line.split()[0] if mode_line else "100644"
              if not os.path.exists(path):
                  entries.append({"path": path, "mode": mode, "type": "blob", "sha": None})
                  continue
              raw = open(path, "rb").read()
              blob = post("git/blobs", {
                  "content": base64.b64encode(raw).decode("ascii"),
                  "encoding": "base64",
              })["sha"]
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob})

          tree = post("git/trees", {"base_tree": base_tree, "tree": entries})["sha"]
          commit = post("git/commits", {
              "message": "test(s2.5): reconcile accepted runtime expectations",
              "tree": tree,
              "parents": [parent],
          })["sha"]
          print(f"VERIFIED_CLEAN_COMMIT_SHA={commit}")
          print("VERIFIED_PATHS=" + ",".join(paths))
          PY
