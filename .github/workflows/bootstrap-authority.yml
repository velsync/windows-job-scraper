name: Bootstrap authoritative repository payload

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'chore: bootstrap repository authority payload'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_0[0-9] .bootstrap/tail_* > /tmp/job-scraper-payload.b64
          base64 --decode /tmp/job-scraper-payload.b64 > /tmp/job-scraper-payload.zip
          echo 'e5c8cf084be31868bd37e533a00cffa2e68da0a58bac1a1cb26183cbe607d369  /tmp/job-scraper-payload.zip' | sha256sum -c -
          python - <<'PY'
          from pathlib import PurePosixPath
          import zipfile
          z = zipfile.ZipFile('/tmp/job-scraper-payload.zip')
          for name in z.namelist():
              p = PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit(f'unsafe zip member: {name}')
          bad = z.testzip()
          if bad:
              raise SystemExit(f'zip CRC failure: {bad}')
          print(f'payload members verified: {len(z.namelist())}')
          PY

      - name: Replace bootstrap tree with authoritative payload
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name bootstrap-authority.yml -exec rm -rf {} +
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/job-scraper-payload.zip') as z:
              z.extractall('.')
          PY

      - name: Verify extracted authority set byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile

          with zipfile.ZipFile('/tmp/job-scraper-payload.zip') as z:
              expected_files = sorted(n for n in z.namelist() if not n.endswith('/'))
              for name in expected_files:
                  actual = Path(name).read_bytes()
                  expected = z.read(name)
                  if actual != expected:
                      raise SystemExit(f'payload mismatch: {name}')

          spec = Path('docs/spec/v0.3.1.3')
          for line in (spec / 'CHECKSUMS.sha256').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              digest, name = line.split(None, 1)
              name = name.strip()
              actual = hashlib.sha256((spec / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'spec checksum mismatch: {name}')

          manifest = json.loads(Path('docs/plans/slice-0-artifact-manifest-v0313.json').read_text(encoding='utf-8'))
          for item in manifest['artifacts']:
              path = item.get('path')
              if not path:
                  continue
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != item['sha256']:
                  raise SystemExit(f'plan checksum mismatch: {path}')

          print(f'payload files exact: {len(expected_files)}')
          print('spec checksums: PASS')
          print('Slice 0 plan checksums: PASS')
          PY

      - name: Commit authoritative workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'docs: establish v0.3.1.3 authority and Slice 0 plan'
          git push origin HEAD:main
