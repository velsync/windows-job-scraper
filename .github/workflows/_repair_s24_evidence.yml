name: Apply S2.4 evidence corrective

on:
  push:
    branches: [repair/s2.4-s2.5-correctives-20260909]
    paths:
      - scripts/_apply_s24_evidence_corrective.py
      - .github/workflows/_repair_s24_evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/s2.4-s2.5-correctives-20260909
          fetch-depth: 0
      - name: Apply evidence boundary corrective
        run: python scripts/_apply_s24_evidence_corrective.py
      - name: Validate patch shape
        run: git diff --check
      - name: Run focused evidence/provisioning tests
        run: |
          python -m venv .repair-venv
          .repair-venv/bin/python -m pip install -r requirements/dev.lock.txt
          .repair-venv/bin/python -m pip install --no-deps .
          .repair-venv/bin/python -m pytest tests/unit/test_s2_4_evidence_boundary_correctives.py tests/unit/test_provisioning.py tests/unit/test_s2_4_provisioning_correctives.py tests/unit/test_s2_4_correctives.py -q
      - name: Remove temporary repair machinery
        run: rm .github/workflows/_repair_s24_evidence.yml scripts/_apply_s24_evidence_corrective.py
      - name: Materialize tested tree as Git object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          paths = [p for p in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines() if p]
          def post(endpoint, payload):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/{endpoint}", data=json.dumps(payload).encode(), headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          entries = []
          for path in paths:
              mode_line = subprocess.check_output(["git", "ls-files", "-s", "--", path], text=True).strip()
              mode = mode_line.split()[0] if mode_line else "100644"
              if not os.path.exists(path):
                  entries.append({"path": path, "mode": mode, "type": "blob", "sha": None})
              else:
                  blob = post("git/blobs", {"content": base64.b64encode(open(path, "rb").read()).decode(), "encoding": "base64"})["sha"]
                  entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob})
          tree = post("git/trees", {"base_tree": base_tree, "tree": entries})["sha"]
          commit = post("git/commits", {"message": "fix(s2.4): enforce fingerprint route evidence causality", "tree": tree, "parents": [parent]})["sha"]
          print(f"CORRECTIVE_COMMIT_SHA={commit}")
          print("CORRECTIVE_PATHS=" + ",".join(paths))
          PY
