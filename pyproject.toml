[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-job-scraper"
version = "0.0.0"
description = "Windows Job Scraper"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.package-data]
jobscraper = [
    "web/templates/*.html",
    "web/static/*",
    "web/static/vendor/*",
]
